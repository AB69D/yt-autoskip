name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Debug build only, as a compile sanity check — the signed release build
      # happens in release.yml, which has the keystore secrets it needs.
      - run: flutter build apk --debug
