name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Debug build only, as a compile sanity check — the signed release build
      # happens in release.yml, which has the keystore secrets it needs.
      #
      # `flutter build apk` itself is unreliable here: Gradle always produces a real APK,
      # but flutter_tools' own step that locates/copies it intermittently reports "Gradle
      # build failed to produce an .apk file" even though the file exists (a flutter_tools
      # bug with this Flutter/AGP/Gradle combination, unrelated to the actual build). So
      # `|| true` swallows that false failure, and the file's actual presence under the
      # redirected build dir (see android/build.gradle.kts) is what really gates the step.
      - name: Build debug APK
        run: |
          flutter build apk --debug || true
          find "$HOME/.flutter-android-build/skipwise/app/outputs" -name "app-debug.apk" | grep -q . || {
            echo "::error::Debug APK was not produced by Gradle"
            exit 1
          }
