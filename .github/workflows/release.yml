name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - name: Decode release keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/skipwise-upload.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../keystore/skipwise-upload.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # `flutter build apk` itself is unreliable here: Gradle always produces a real,
      # signed APK, but flutter_tools' own step that locates/copies it intermittently
      # reports "Gradle build failed to produce an .apk file" even though the file exists
      # (a flutter_tools bug with this Flutter/AGP/Gradle combination, unrelated to the
      # actual build or to signing). So `|| true` swallows that false failure, and the
      # next step gates on the file's actual presence under the redirected build dir
      # (see android/build.gradle.kts) instead of trusting flutter_tools' exit code.
      #
      # versionName stays whatever's in pubspec.yaml; versionCode is pinned to the CI run
      # number so it always increases, which Android requires for every new install to be
      # accepted as an update over the last one.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} || true

      - name: Locate and rename the built APK
        run: |
          APK_PATH=$(find "$HOME/.flutter-android-build/skipwise/app/outputs" -name "app-release.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not produced by Gradle"
            exit 1
          fi
          cp "$APK_PATH" SkipWise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SkipWise.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SkipWise-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SkipWise-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev cmake

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: |
          mkdir -p /tmp/pkg
          cp -r build/linux/x64/release/bundle/. /tmp/pkg/
          tar -C /tmp/pkg -czf SkipWise-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: SkipWise-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/SkipWise.app SkipWise-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: SkipWise-macos.zip

  publish-release:
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          cp artifacts/android-apk/SkipWise.apk release-assets/
          cp artifacts/windows-zip/SkipWise-windows.zip release-assets/
          cp artifacts/linux-tarball/SkipWise-linux.tar.gz release-assets/
          cp artifacts/macos-zip/SkipWise-macos.zip release-assets/

      - name: Publish/update the "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SkipWise — latest build"
          body: |
            Automatically built from commit ${{ github.sha }} (run #${{ github.run_number }}).

            - **Android**: download `SkipWise.apk`, open it on your phone to install (you'll need to allow "install unknown apps" for whichever app you downloaded it with).
            - **Windows**: download `SkipWise-windows.zip`, extract it, run `skipwise.exe` inside.
            - **Linux**: download `SkipWise-linux.tar.gz`, extract it, run `./skipwise` from inside the extracted folder.
            - **macOS**: download `SkipWise-macos.zip`, extract it, then right-click `SkipWise.app` → Open (it's unsigned — no Apple Developer certificate — so Gatekeeper needs that once).

            Only the Android build actually skips ads — it's the only platform with the Accessibility Service integration this app is built around. The Windows/Linux/macOS builds are the same Flutter UI shell, provided so the project can be run and inspected on desktop too.
          make_latest: true
          files: release-assets/*
