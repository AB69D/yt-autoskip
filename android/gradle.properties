org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle's file-system-watching daemon was intermittently throwing "Unable to watch same
# file twice via different paths" right after a successful build, which made
# `flutter build apk` unable to locate its own output and fail the whole command even
# though Gradle had produced a valid APK. Disabling it removes that failure mode; it only
# costs a little incremental-build speed, which doesn't matter for CI or one-off builds.
org.gradle.vfs.watch=false
